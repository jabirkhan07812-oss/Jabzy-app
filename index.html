async function startChatRealtime(){
if(chatChannel){
await db.removeChannel(chatChannel);
chatChannel=null;
}

if(!me||!selected)return;

chatChannel=db.channel("chat-"+me.id+"-"+selected)
.on("postgres_changes",{
event:"*",
schema:"public",
table:"messages"
},payload=>{
  const m=payload.new || payload.old || {};
  const isCurrentChat =
    (m.sender_id===me.id && m.receiver_id===selected) ||
    (m.sender_id===selected && m.receiver_id===me.id);

  // Refresh the open conversation when its message changes.
  if(isCurrentChat){
    loadMessages(true);
  }

  // Keep the chat list preview and latest-message order up to date.
  const chatList=document.getElementById("chatList");
  if(chatList && chatList.style.display!=="none"){
    const belongsToMe =
      m.sender_id===me.id || m.receiver_id===me.id;

    // DELETE payloads may contain only the row ID; refresh the list
    // in that case too, so an unsent latest message disappears.
    if(belongsToMe || payload.eventType==="DELETE"){
      loadChatList();
    }
  }
})
.subscribe((status)=>{
  if(status==="CHANNEL_ERROR" || status==="TIMED_OUT"){
    console.warn("Chat realtime status:",status);
  }
});
}

async function createJabzyAccount(){
  const username=document.getElementById("signupName").value.trim();
  const dob=document.getElementById("signupDob").value;
  const bio=document.getElementById("signupBio").value.trim();
  const accepted=document.getElementById("privacyConsent").checked;

  if(!username || !dob){
    status("Name aur Date of Birth zaroori hai.");
    return;
  }

  if(!accepted){
    status("Please accept the Privacy Notice first.");
    return;
  }

  const birthDate=new Date(dob+"T00:00:00");
  const today=new Date();
  let age=today.getFullYear()-birthDate.getFullYear();
  const month=today.getMonth()-birthDate.getMonth();

  if(month<0 || (month===0 && today.getDate()<birthDate.getDate())){
    age--;
  }

  if(isNaN(birthDate.getTime()) || birthDate>today || age<18){
    status("JABZY par account banane ke liye 18+ hona zaroori hai.");
    return;
  }

  status("Please wait...");

  if(signupProvider==="google"){
    const googlePassword=document.getElementById("googleSignupPassword").value;
    const googleConfirm=document.getElementById("googleSignupConfirmPassword").value;
    if(googlePassword.length<6){status("JABZY password kam se kam 6 characters ka hona chahiye.");return;}
    if(googlePassword!==googleConfirm){status("Dono JABZY password match nahi karte.");return;}

    const {error:metadataError}=await db.auth.updateUser({
      data:{username:username,date_of_birth:dob,bio:bio}
    });
    if(metadataError){status("Date of Birth save nahi hua: "+metadataError.message);return;}

    const {error:profileError}=await db.rpc("complete_google_profile",{
      p_username:username,
      p_dob:dob,
      p_bio:bio,
      p_privacy_accepted:true
    });
    if(profileError){status(profileError.message);return;}

    const {error:passwordError}=await db.auth.updateUser({
      password:googlePassword,
      data:{jabzy_password_set:true}
    });
    if(passwordError){status("Profile ban gaya, lekin JABZY password set nahi hua: "+passwordError.message);return;}

    me=(await db.auth.getUser()).data.user;
    await startApp();
    return;
  }

  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;

  const {error}=await db.auth.signUp({
    email,
    password,
    options:{
      data:{
        username:username,
        date_of_birth:dob,
        bio:bio
      },
      emailRedirectTo:"https://jabirkhan07812-oss.github.io/Jabzy-app/"
    }
  });

  status(error ? error.message : "Account created. Check your email for confirmation.");
  }

function autoResizeHomePostCaption(field){
  if(!field)return;
  const modal=document.getElementById("homePostModal");
  const modalScroll=modal?modal.scrollTop:0;
  const pageScroller=document.scrollingElement||document.documentElement;
  const pageScroll=pageScroller.scrollTop;
  const fieldTop=field.getBoundingClientRect().top;
  field.style.height="34px";
  field.style.height=Math.max(34,field.scrollHeight)+"px";
  if(modal){
    modal.scrollTop=modalScroll;
    requestAnimationFrame(()=>{
      modal.scrollTop=modalScroll;
      if(Math.abs(field.getBoundingClientRect().top-fieldTop)>1)modal.scrollTop+=field.getBoundingClientRect().top-fieldTop;
    });
  }
  pageScroller.scrollTop=pageScroll;
  requestAnimationFrame(()=>{pageScroller.scrollTop=pageScroll;});
}

async function handleHomePost(){
  if(!me){appStatus("Please login first.");return;}
  if(!jabzyOfficialAdminSession){

  }
  const button=document.getElementById("homePostButton");
  const textBox=document.getElementById("homePostText");
  const fileInput=document.getElementById("homePostMedia");
  const content=textBox.value.trim();
  const file=fileInput.files&&fileInput.files[0];
  if(!content&&!file){appStatus("Post mein text ya photo/video add karein.");return;}
  if(file&&!file.type.startsWith("image/")&&!file.type.startsWith("video/")){appStatus("Sirf photo ya video upload kar sakte hain.");return;}
  button.disabled=true;button.textContent="Posting...";
  try{
    let mediaUrl=null,mediaType=null;
    if(file){
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=me.id+"/"+Date.now()+"_"+safeName;
      const {error:uploadError}=await db.storage.from("posts").upload(path,file,{contentType:file.type,upsert:false});
      if(uploadError)throw uploadError;
      const {data:publicData}=db.storage.from("posts").getPublicUrl(path);
      mediaUrl=publicData.publicUrl;
      mediaType=file.type.startsWith("image/")?"image":"video";
    }
    const {error}=await db.from("posts").insert({user_id:me.id,content,media_url:mediaUrl,media_type:mediaType});

    textBox.value="";textBox.placeholder="What's on your mind?";textBox.style.height="34px";fileInput.value="";
    document.getElementById("homePostPreview").replaceChildren();
    document.getElementById("homePostPreview").style.display="none";
    document.getElementById("homePostFileName").textContent="";

    appStatus("Post shared successfully ❤️");
    await loadHomePosts();
  }catch(error){
    console.error("Home post error:",error);
    appStatus(error.message||"Post upload nahi ho payi.");
  }finally{
    button.disabled=false;button.textContent="Post";
  }
}

  const {data:requests,error}=await db.from("friend_requests").select("sender_id,receiver_id").eq("status","accepted").or("sender_id.eq."+me.id+",receiver_id.eq."+me.id);

    const send=document.createElement("button");send.type="button";send.textContent="Send";send.style.cssText="width:auto;margin:0;padding:8px 15px;border-radius:16px;font-size:12px;";
    send.onclick=async()=>{

      const {error:sendError}=await db.from("messages").insert({sender_id:me.id,receiver_id:friend.id,message:buildPostShareText(post),reply_to:null});
      if(sendError){send.disabled=false;send.textContent="Send";appStatus(sendError.message);return;}
      send.textContent="Sent ✓";appStatus("Post friend ko send ho gayi ❤️");
    };
    row.append(label,send);list.appendChild(row);
  });

function jabzyMobileNotificationKey(){
  return "jabzy_mobile_notifications_"+(me&&me.id?me.id:"guest");
}
function isJabzyMobileNotificationsEnabled(){
  if(!("Notification" in window)||Notification.permission!=="granted")return false;
  try{
    const saved=localStorage.getItem(jabzyMobileNotificationKey());
    if(saved==="false")return false;
    if(saved==="true")return true;
    localStorage.setItem(jabzyMobileNotificationKey(),"true");
    return true;
  }catch(error){return Notification.permission==="granted";}
}
function refreshJabzyMobileNotificationToggle(){
  const button=document.getElementById("jabzyMobileNotificationToggle");
  const statusBox=document.getElementById("jabzyPushPermissionStatus");
  if(!button||!statusBox)return;
  const enabled=isJabzyMobileNotificationsEnabled();
  button.textContent=enabled?"🔕 Turn Off Mobile Notifications":"📲 Enable Mobile Notifications";
  button.style.background=enabled?"linear-gradient(120deg,#64748b,#475569)":"linear-gradient(120deg,#ff4d9d,#8755e8)";
  statusBox.textContent=enabled?"✅ Mobile notifications are ON. Your choice stays saved after refresh.":(Notification.permission==="denied"?"Notifications are blocked in browser settings. Allow them from site settings.":"Mobile notifications are OFF. Turn them on whenever you want.");
}
async function toggleJabzyMobileNotifications(){
  if(isJabzyMobileNotificationsEnabled()){
    try{localStorage.setItem(jabzyMobileNotificationKey(),"false");}catch(error){}
    refreshJabzyMobileNotificationToggle();
    appStatus("Mobile notifications band kar diye gaye.");
    return;
  }
  await enableJabzyNotifications();
}
async function enableJabzyNotifications(){
  const statusBox=document.getElementById("jabzyPushPermissionStatus");
  if(!("Notification" in window)){
    if(statusBox)statusBox.textContent="Is browser mein mobile notifications supported nahi hain.";
    return;
  }
  if(!window.isSecureContext){
    if(statusBox)statusBox.textContent="Notifications ke liye secure HTTPS connection zaroori hai.";
    return;
  }
  try{
    const permission=await Notification.requestPermission();
    if(permission!=="granted"){
      if(statusBox)statusBox.textContent="Notification permission allow nahi hui. Browser settings se JABZY notifications allow karein.";
      return;
    }
    await registerJabzyServiceWorker();
    try{localStorage.setItem(jabzyMobileNotificationKey(),"true");}catch(error){}
    refreshJabzyMobileNotificationToggle();
    if(statusBox)statusBox.textContent="✅ Mobile notifications ON. Ye setting refresh ke baad bhi saved rahegi.";
    if(jabzyServiceWorkerRegistration){
      await jabzyServiceWorkerRegistration.showNotification("JABZY notifications enabled",{
        body:"Ab JABZY ke alerts yahan dikh sakte hain.",
        icon:"./jabzy-app-icon.svg",
        badge:"./jabzy-app-icon.svg",
        tag:"jabzy-permission-test"
      });
    }
  }catch(error){
    if(statusBox)statusBox.textContent="Notification setup error: "+(error.message||error);
  }
}

}

    .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"recipient_id=eq."+me.id},async payload=>{
      const n=payload.new||{};
      if(n.type==="like"&&jabzyUserSettings.notify_likes===false)return;
      if(n.type==="match"&&jabzyUserSettings.notify_matches===false)return;

      const body=n.message||((actorName+" "+(labels[n.type]||"sent you an update.")));
      const key=n.type==="message"?"msg:"+n.actor_id+":"+body.slice(0,70):"notification:"+n.id;
      jabzyShowDedupedAlert(key,"JABZY",body,"jabzy-notification-"+(n.id||Date.now()));
      loadNotificationCount();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"receiver_id=eq."+me.id},async payload=>{
      const m=payload.new||{};

      let senderName="Someone";

      if(data&&data.username)senderName=data.username;
      const body=m.message||"Sent you a photo or attachment.";
      const key="msg:"+m.sender_id+":"+body.slice(0,70);
      jabzyShowDedupedAlert(key,"New message • "+senderName,body,"jabzy-message-"+m.sender_id);
      loadChatList();
    })
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")console.warn("JABZY notification realtime:",status);
    });
}

function jabzyShowDedupedAlert(key,title,body,tag){
  const now=Date.now();
  const previous=jabzyRecentAlertKeys.get(key)||0;
  if(now-previous<8000)return;
  jabzyRecentAlertKeys.set(key,now);
  for(const [k,t] of jabzyRecentAlertKeys){if(now-t>30000)jabzyRecentAlertKeys.delete(k);}
  jabzyShowMobileAlert(title,body,tag);
}

async function loadFriendRequests(){
  const box=document.getElementById("friendRequestsList");
  if(!box||!me)return;
  box.innerHTML='<div class="jabzy-friend-loading">Loading friend requests...</div>';
  try{
    const {data:requests,error}=await db.from("friend_requests")
      .select("id,sender_id,created_at")
      .eq("receiver_id",me.id)
      .eq("status","pending")
      .order("created_at",{ascending:false});
    if(error)throw error;
    const tab=document.getElementById("friendsRequestsTab");
    if(tab)tab.textContent=requests&&requests.length?"Requests ("+requests.length+")":"Requests";
    box.replaceChildren();
    if(!requests||requests.length===0){
      const empty=document.createElement("div");
      empty.className="jabzy-friend-empty";
      empty.innerHTML='<div class="jabzy-friend-empty-icon">👥</div><strong>No friend requests yet</strong><span>When someone sends you a request, it will appear here.</span>';
      box.appendChild(empty);
      return;
    }
    const ids=[...new Set(requests.map(r=>r.sender_id))];
    const {data:profiles,error:profileError}=await db.from("profiles")
      .select("id,username,photo_url,bio")
      .in("id",ids);
    if(profileError)throw profileError;
    requests.forEach(request=>{
      const person=(profiles||[]).find(p=>p.id===request.sender_id);
      if(!person)return;
      const card=document.createElement("article");
      card.className="jabzy-friend-request-card";
      const main=document.createElement("div");
      main.className="jabzy-friend-request-main";
      const avatar=document.createElement("button");
      avatar.type="button";avatar.className="jabzy-friend-request-avatar";
      if(person.photo_url){
        const photo=document.createElement("img");photo.src=person.photo_url;photo.alt="";
        avatar.appendChild(photo);
      }else avatar.textContent=(person.username||"J").trim().charAt(0).toUpperCase();
      avatar.onclick=()=>openPublicProfile(person.id);
      const details=document.createElement("div");
      details.className="jabzy-friend-request-details";
      const name=document.createElement("button");
      name.type="button";name.className="jabzy-friend-request-name";
      name.textContent=person.username||"JABZY User";
      name.onclick=()=>openPublicProfile(person.id);
      const note=document.createElement("div");
      note.className="jabzy-friend-request-note";
      note.textContent="Wants to be your friend";
      details.append(name,note);
      main.append(avatar,details);
      const actions=document.createElement("div");
      actions.className="jabzy-friend-request-actions";
      const confirm=document.createElement("button");
      confirm.type="button";confirm.className="jabzy-friend-confirm";
      confirm.textContent="Confirm";
      confirm.onclick=async()=>{confirm.disabled=true;await respondFriendRequest(request.id,"accepted");};
      const remove=document.createElement("button");
      remove.type="button";remove.className="jabzy-friend-delete";
      remove.textContent="Delete";
      remove.onclick=async()=>{remove.disabled=true;await respondFriendRequest(request.id,"rejected");};
      actions.append(confirm,remove);
      card.append(main,actions);
      box.appendChild(card);
    });
  }catch(error){
    console.error("Friend requests load error:",error);
    box.textContent=error.message||"Friend requests load nahi ho sake.";
  }
}

let friendsRealtimeChannel=null;
let friendsRealtimeUserId=null;
let friendsRefreshInProgress=false;
let friendsRefreshQueued=false;
let friendsCachedIds=[];

async function setupFriendsRealtime(){
  if(!me)return;
  if(friendsRealtimeChannel && friendsRealtimeUserId===me.id)return;
  if(friendsRealtimeChannel){
    await db.removeChannel(friendsRealtimeChannel);
    friendsRealtimeChannel=null;
  }
  friendsRealtimeUserId=me.id;
  friendsRealtimeChannel=db.channel("friends-live-"+me.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"sender_id=eq."+me.id},()=>loadMyFriends(true))
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"receiver_id=eq."+me.id},()=>loadMyFriends(true))
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},payload=>{
      const changedId=(payload.new&&payload.new.id)||(payload.old&&payload.old.id);
      if(changedId && friendsCachedIds.includes(changedId))loadMyFriends(true);
    })
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")console.warn("Friends Realtime:",status);
    });
}

async function loadMyFriends(silent=false){
  if(friendsRefreshInProgress){
    friendsRefreshQueued=true;
    return;
  }
  friendsRefreshInProgress=true;
  const box=document.getElementById("myFriendsList");
  const countBox=document.getElementById("myFriendsCount");
  if(!box||!countBox){friendsRefreshInProgress=false;return;}
  if(!silent && box.dataset.loaded!=="true")box.innerText="Loading your circle...";
  try{
    const {data:requests,error}=await db.from("friend_requests")
      .select("sender_id,receiver_id")
      .eq("status","accepted")
      .or("sender_id.eq."+me.id+",receiver_id.eq."+me.id);
    if(error)throw error;
    const ids=[...new Set((requests||[]).map(r=>r.sender_id===me.id?r.receiver_id:r.sender_id))];
    const nextContent=document.createElement("div");
    if(ids.length===0){
      nextContent.textContent="Your circle is waiting for friends ❤️";
      countBox.innerText="0 Friends";
      box.replaceChildren(...nextContent.childNodes);
      friendsCachedIds=[];
      box.dataset.loaded="true";
      return;
    }
    const {data:friends,error:friendError}=await db.from("profiles")
      .select("id,username,photo_url").in("id",ids);
    if(friendError)throw friendError;
    const profileMap=new Map((friends||[]).map(friend=>[friend.id,friend]));
    const adminFlags=await Promise.all(ids.map(friendId=>isOfficialAdminUser(friendId)));
    for(let i=0;i<ids.length;i++){
      const friendId=ids[i];
      const friend=profileMap.get(friendId)||{id:friendId,username:"",photo_url:""};
      const row=document.createElement("button");
      row.type="button";
      const light=document.body.classList.contains("light-theme");
      row.style.cssText="display:flex;align-items:center;gap:12px;width:100%;padding:10px;margin-top:8px;border:0;border-radius:12px;background:"+(light?"#ffffff":"#ffffff18")+";color:"+(light?"#241b30":"#ffffff")+";text-align:left;";
      const img=document.createElement("img");
      img.src=friend.photo_url||"";
      img.alt="";
      img.style.cssText="width:42px;height:42px;border-radius:50%;object-fit:cover;background:#555;";
      const name=document.createElement("span");
      name.style.cssText="display:flex;align-items:center;flex-wrap:wrap;min-width:0;font-weight:700;";
      name.textContent=friend.username&&friend.username.trim()?friend.username:"JABZY Friend";
      if(adminFlags[i])addOfficialAdminMark(name);
      row.append(img,name);
      row.onclick=()=>openPublicProfile(friendId);
      nextContent.appendChild(row);
    }
    if(!friends||friends.length===0){
      const note=document.createElement("p");
      note.textContent="Friend profiles load nahi hui. Aapke friends ka record hai, lekin unki profile details available nahi hain.";
      note.style.cssText="font-size:12px;color:#d9c9e8;margin:10px 2px;";
      nextContent.appendChild(note);
    }
    box.replaceChildren(...nextContent.childNodes);
    countBox.innerText=ids.length+" Friends";
    friendsCachedIds=ids;
    box.dataset.loaded="true";
  }catch(error){
    console.error("Friends load error:",error);
    if(!silent || box.dataset.loaded!=="true")box.innerText=error.message||"Friends load nahi ho sake.";
  }finally{
    friendsRefreshInProgress=false;
    if(friendsRefreshQueued){
      friendsRefreshQueued=false;
      loadMyFriends(true);
    }
  }
}

    .or(`and(sender_id.eq.${me.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${me.id})`);

  if(checkError){appStatus(checkError.message);return}

  const pending=(old||[]).find(r=>r.status==="pending");

  if(pending){
    appStatus(pending.sender_id===me.id?
      "Request pehle hi bhej di hai.":

  }

  const {error}=await db.from("message_requests").insert({
    sender_id:me.id,
    receiver_id:userId,
    message:firstMessage.trim(),
    status:"pending"
  });

  if(error){appStatus(error.message);return}

  appStatus("Message Request sent ❤️");
};

async function updateOnlineStatus(){
  if(!me)return;
  await loadJabzyUserSettings();
  if(jabzyUserSettings.show_online_status===false)return;

  for(let attempt=1;attempt<=2;attempt++){
    const {error}=await db
      .from("profiles")
      .update({last_seen:new Date().toISOString()})
      .eq("id",me.id);

    if(!error)return;

    console.warn("Last Seen update attempt "+attempt+" failed:",error.message);

    if(attempt===1){
      await new Promise(resolve=>setTimeout(resolve,1200));
    }
  }
}

    }

  }

  actionRow.append(followBtn,friendBtn);
  card.appendChild(actionRow);
  }

let jabzyVoiceListener=null;

let jabzyIncomingRingTimer=null;
let jabzyRingAudioContext=null;
function stopIncomingCallAlert(){
  if(jabzyIncomingRingTimer){clearInterval(jabzyIncomingRingTimer);jabzyIncomingRingTimer=null;}
  try{navigator.vibrate?.(0);}catch(e){}
  try{if(jabzyRingAudioContext){jabzyRingAudioContext.close();jabzyRingAudioContext=null;}}catch(e){}
}
function startIncomingCallAlert(){
  stopIncomingCallAlert();
  const vibrate=()=>{try{if(navigator.vibrate)navigator.vibrate([450,250,450,700]);}catch(e){}};
  vibrate();
  jabzyIncomingRingTimer=setInterval(vibrate,1900);
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    jabzyRingAudioContext=new AudioCtx();
    const ctx=jabzyRingAudioContext;
    const ring=()=>{
      if(!jabzyRingAudioContext||ctx.state==="closed")return;
      const now=ctx.currentTime;
      [0,0.32].forEach(offset=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type="sine";osc.frequency.setValueAtTime(880,now+offset);
        gain.gain.setValueAtTime(0.0001,now+offset);
        gain.gain.exponentialRampToValueAtTime(0.12,now+offset+0.025);
        gain.gain.setValueAtTime(0.12,now+offset+0.19);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.24);
        osc.connect(gain);gain.connect(ctx.destination);
        osc.start(now+offset);osc.stop(now+offset+0.25);
      });
    };
    if(ctx.state==="suspended")ctx.resume().then(()=>{if(jabzyRingAudioContext===ctx)ring();}).catch(()=>{});
    else ring();
    jabzyIncomingRingTimer=setInterval(()=>{vibrate();ring();},1900);
  }catch(e){console.warn("Incoming call sound unavailable:",e);}
}

      ],jabzyVoiceIncomingCall.callerPhoto,jabzyVoiceIncomingCall.callerName);

    })
    .subscribe();
}
async function startVoiceCall(){
  if(!me||!selected){appStatus("Pehle kisi user ki chat kholein.");return;}
  if(jabzyVoiceCall||jabzyVoiceIncomingCall){appStatus("Ek call pehle se chal rahi hai.");return;}
  const calleeId=selected;
  if(calleeId===me.id){appStatus("Aap khud ko call nahi kar sakte.");return;}
  try{
    const blocked=await getBlockedIds();
    if(blocked.has(calleeId)){appStatus("Blocked user ko call nahi kar sakte.");return;}
    const {data:profile}=await db.from("profiles").select("username,photo_url").eq("id",me.id).maybeSingle();
    const {data:call,error}=await db.from("voice_calls").insert({caller_id:me.id,callee_id:calleeId}).select("id").single();
    if(error)throw error;
    const channel=db.channel("jabzy-voice-call:"+call.id,{config:{broadcast:{self:false}}});
    jabzyVoiceCall={id:call.id,peerId:calleeId,channel,pc:null,stream:null,role:"caller",connected:false};
    voiceCallPanel("Calling…","Waiting for the other user to answer",[
      {label:"Cancel call",color:"#b83255",onClick:()=>endVoiceCall("ended")}
    ]);
    channel.on("broadcast",{event:"signal"},({payload})=>handleVoiceCallSignal(payload));
    const status=await new Promise(resolve=>{
      const timer=setTimeout(()=>resolve("TIMEOUT"),12000);
      channel.subscribe(value=>{if(value==="SUBSCRIBED"){clearTimeout(timer);resolve(value);}else if(value==="CHANNEL_ERROR"||value==="TIMED_OUT"){clearTimeout(timer);resolve(value);}});
    });
    if(status!=="SUBSCRIBED")throw new Error("Call connection nahi ban paya. Dobara try karein.");
    const notifyChannel=db.channel("jabzy-voice-user:"+calleeId,{config:{broadcast:{self:false}}});
    const notifyStatus=await new Promise(resolve=>{
      const timer=setTimeout(()=>resolve("TIMEOUT"),10000);
      notifyChannel.subscribe(value=>{
        if(value==="SUBSCRIBED"){clearTimeout(timer);resolve(value);}
        else if(value==="CHANNEL_ERROR"||value==="TIMED_OUT"){clearTimeout(timer);resolve(value);}
      });
    });
    if(notifyStatus!=="SUBSCRIBED"){
      await db.removeChannel(notifyChannel);
      throw new Error("Dusre user tak call notification nahi pahunchi.");
    }
    await notifyChannel.send({type:"broadcast",event:"incoming-call",payload:{callId:call.id,callerId:me.id,calleeId,callerName:profile?.username||"JABZY user",callerPhoto:profile?.photo_url||null}});
    await db.removeChannel(notifyChannel);
    const started=Date.now();
    jabzyVoiceCall.ringTimer=setInterval(async()=>{
      if(!jabzyVoiceCall||jabzyVoiceCall.id!==call.id)return;
      const {data}=await db.from("voice_calls").select("status").eq("id",call.id).maybeSingle();
      if(!data||["rejected","ended","missed"].includes(data.status)){
        await endVoiceCall(data?.status||"ended",false);
      }else if(data.status==="ringing"&&Date.now()-started>60000){
        await endVoiceCall("missed");
      }
    },1800);
  }catch(error){
    console.error("Voice call start:",error);
    await endVoiceCall("ended");
    appStatus("Call start nahi hui: "+(error.message||"Unknown error"));
  }
}
async function acceptVoiceCall(){
  const incoming=jabzyVoiceIncomingCall;
  if(!incoming)return;
  stopIncomingCallAlert();
  try{
    const {error}=await db.rpc("set_voice_call_status",{p_call_id:incoming.callId,p_status:"accepted"});
    if(error)throw error;
    const channel=db.channel("jabzy-voice-call:"+incoming.callId,{config:{broadcast:{self:false}}});
    jabzyVoiceCall={id:incoming.callId,peerId:incoming.callerId,channel,pc:null,stream:null,role:"callee",connected:false};
    jabzyVoiceIncomingCall=null;
    voiceCallPanel("Connecting…","Starting secure microphone connection",[
      {label:"End call",color:"#b83255",onClick:()=>endVoiceCall("ended")}
    ]);
    channel.on("broadcast",{event:"signal"},({payload})=>handleVoiceCallSignal(payload));
    const status=await new Promise(resolve=>{
      const timer=setTimeout(()=>resolve("TIMEOUT"),12000);
      channel.subscribe(value=>{if(value==="SUBSCRIBED"){clearTimeout(timer);resolve(value);}else if(value==="CHANNEL_ERROR"||value==="TIMED_OUT"){clearTimeout(timer);resolve(value);}});
    });
    if(status!=="SUBSCRIBED")throw new Error("Call channel connect nahi hua.");
    await prepareVoicePeer(false);
    await channel.send({type:"broadcast",event:"signal",payload:{kind:"ready"}});
    const acceptedCallId=incoming.callId;
    jabzyVoiceCall.ringTimer=setInterval(async()=>{
      if(!jabzyVoiceCall||jabzyVoiceCall.id!==acceptedCallId)return;
      const {data}=await db.from("voice_calls").select("status").eq("id",acceptedCallId).maybeSingle();
      if(!data||["rejected","ended","missed"].includes(data.status)){
        await endVoiceCall(data?.status||"ended",false);
      }
    },1200);
  }catch(error){
    console.error("Accept voice call:",error);
    await endVoiceCall("ended");
    appStatus("Call connect nahi hui: "+error.message);
  }
}
async function rejectVoiceCall(){
  const incoming=jabzyVoiceIncomingCall;
  stopIncomingCallAlert();
  jabzyVoiceIncomingCall=null;closeVoiceCallPanel();
  if(incoming)await db.rpc("set_voice_call_status",{p_call_id:incoming.callId,p_status:"rejected"});
}
async function prepareVoicePeer(makeOffer){
  const call=jabzyVoiceCall;if(!call)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)throw new Error("Is device/browser mein voice calling supported nahi hai.");
  call.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  call.pc=pc;
  call.stream.getAudioTracks().forEach(track=>pc.addTrack(track,call.stream));
  pc.ontrack=event=>{
    let audio=document.getElementById("jabzyVoiceRemoteAudio");
    if(!audio){audio=document.createElement("audio");audio.id="jabzyVoiceRemoteAudio";audio.autoplay=true;audio.playsInline=true;document.body.appendChild(audio);}
    audio.srcObject=event.streams?.[0]||new MediaStream([event.track]);
    audio.play().catch(()=>appStatus("Audio sunne ke liye screen par tap karein."));
  };
  pc.onicecandidate=event=>{
    if(event.candidate&&jabzyVoiceCall?.id===call.id)call.channel.send({type:"broadcast",event:"signal",payload:{kind:"candidate",candidate:event.candidate}});
  };
  pc.onconnectionstatechange=()=>{
    if(!jabzyVoiceCall||jabzyVoiceCall.id!==call.id)return;
    if(pc.connectionState==="connected"){
      call.connected=true;voiceCallPanel("Voice call connected","Aapki call chal rahi hai",[
        {label:"Mute",color:"#76518c",onClick:toggleVoiceCallMute},
        {label:"End call",color:"#b83255",onClick:()=>endVoiceCall("ended")}
      ]);
    }else if(["failed","disconnected"].includes(pc.connectionState)){
      voiceCallPanel("Call connection lost","Network check karein",[
        {label:"End call",color:"#b83255",onClick:()=>endVoiceCall("ended")}
      ]);
    }
  };
  if(makeOffer){
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    await call.channel.send({type:"broadcast",event:"signal",payload:{kind:"description",description:pc.localDescription}});
  }
}
async function handleVoiceCallSignal(payload){
  const call=jabzyVoiceCall;if(!call||!payload)return;
  try{
    if(payload.kind==="ready"&&call.role==="caller"&&!call.pc){await prepareVoicePeer(true);return;}
    if(payload.kind==="description"&&payload.description&&call.pc){
      await call.pc.setRemoteDescription(payload.description);
      if(payload.description.type==="offer"){
        const answer=await call.pc.createAnswer();await call.pc.setLocalDescription(answer);
        await call.channel.send({type:"broadcast",event:"signal",payload:{kind:"description",description:call.pc.localDescription}});
      }
    }else if(payload.kind==="candidate"&&payload.candidate&&call.pc&&call.pc.remoteDescription){
      await call.pc.addIceCandidate(payload.candidate);
    }
  }catch(error){console.error("Voice signal:",error);}
}
let jabzyVoiceMuted=false;
function toggleVoiceCallMute(){
  if(!jabzyVoiceCall?.stream)return;
  jabzyVoiceMuted=!jabzyVoiceMuted;
  jabzyVoiceCall.stream.getAudioTracks().forEach(track=>track.enabled=!jabzyVoiceMuted);
  voiceCallPanel("Voice call connected",jabzyVoiceMuted?"Microphone muted":"Aapki call chal rahi hai",[
    {label:jabzyVoiceMuted?"Unmute":"Mute",color:"#76518c",onClick:toggleVoiceCallMute},
    {label:"End call",color:"#b83255",onClick:()=>endVoiceCall("ended")}
  ]);
}
async function endVoiceCall(status="ended",updateServer=true){
  stopIncomingCallAlert();
  const call=jabzyVoiceCall;
  jabzyVoiceCall=null;
  if(call){
    if(call.ringTimer)clearInterval(call.ringTimer);
    if(call.statusTimer)clearInterval(call.statusTimer);
    try{call.pc?.close();}catch(e){}
    call.stream?.getTracks().forEach(track=>track.stop());
    const audio=document.getElementById("jabzyVoiceRemoteAudio");if(audio){audio.pause();audio.srcObject=null;audio.remove();}
    if(updateServer)await db.rpc("set_voice_call_status",{p_call_id:call.id,p_status:status});
    try{await db.removeChannel(call.channel);}catch(e){}
  }
  jabzyVoiceIncomingCall=null;closeVoiceCallPanel();
}

async function toggleChatReaction(messageId,emoji){
  try{
    const {data:existing,error:findError}=await db
      .from("chat_message_reactions")
      .select("emoji")
      .eq("message_id",messageId)
      .eq("user_id",me.id)
      .maybeSingle();

    if(findError){
      appStatus(findError.message);
      return;
    }

    if(existing && existing.emoji===emoji){
      const {error}=await db
        .from("chat_message_reactions")
        .delete()
        .eq("message_id",messageId)
        .eq("user_id",me.id);

      if(error) throw error;
    }else{
      const {error}=await db
        .from("chat_message_reactions")
        .upsert({
          message_id:messageId,
          user_id:me.id,
          emoji
        },{
          onConflict:"message_id,user_id"
        });

      if(error) throw error;
    }

    await loadMessages();

  }catch(e){
    appStatus("Reaction error: "+e.message);
  }
}

  
async function forwardChatMessage(message){

  let blocked;
  try{
    blocked=await getBlockedIds();
  }catch(e){
    appStatus(e.message);
    return;
  }

  const {data:sent,error}=await db.from("likes")
    .select("to_user")
    .eq("from_user",me.id);

  if(error){
    appStatus(error.message);
    return;
  }

  const ids=(sent||[]).map(x=>x.to_user);

  if(!ids.length){
    appStatus("Abhi koi connection nahi hai.");
    return;
  }

  const {data:received,error:matchError}=await db.from("likes")
    .select("from_user")
    .in("from_user",ids)
    .eq("to_user",me.id);

  if(matchError){
    appStatus(matchError.message);
    return;
  }

  const matchIds=(received||[])
    .map(x=>x.from_user)
    .filter(id=>!blocked.has(id));

  if(!matchIds.length){
    appStatus("Koi available connection nahi hai.");
    return;
  }

  const {data:profiles,error:profileError}=await db.from("profiles")
    .select("id,username")
    .in("id",matchIds);

  if(profileError){
    appStatus(profileError.message);
    return;
  }

  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:#000b;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";

  const panel=document.createElement("div");
  panel.style.cssText="background:#29213a;border:1px solid #69427f;border-radius:16px;padding:18px;width:100%;max-width:360px;color:white;";

  const heading=document.createElement("h3");
  heading.textContent="Forward message";
  panel.appendChild(heading);

  const select=document.createElement("select");
  select.style.cssText="width:100%;padding:12px;background:#171124;color:white;border:1px solid #69427f;border-radius:9px;margin:10px 0;";

  const placeholder=document.createElement("option");
  placeholder.value="";
  placeholder.textContent="Select connection";
  select.appendChild(placeholder);

  (profiles||[]).forEach(p=>{
    const option=document.createElement("option");
    option.value=p.id;
    option.textContent=p.username||"User";
    select.appendChild(option);
  });

  panel.appendChild(select);

  const send=document.createElement("button");
  send.textContent="Forward";
  send.style.cssText="padding:10px 18px;background:#a64bd4;color:white;border:0;border-radius:9px;margin-right:8px;";

  const cancel=document.createElement("button");
  cancel.textContent="Cancel";
  cancel.style.cssText="padding:10px 18px;background:#493257;color:white;border:0;border-radius:9px;";

  send.onclick=async()=>{
    const recipient=select.value;

    if(!recipient){
      appStatus("Connection select karein.");
      return;
    }

    send.disabled=true;
    send.textContent="Sending...";

    try{
      let forwardedMessage=message;

      if(message.startsWith("PHOTO:")){
        const sourcePath=message.slice(6);

        const {data:photo,error:downloadError}=await db.storage
          .from("chat-photos")
          .download(sourcePath);

        if(downloadError) throw downloadError;

        const ext=sourcePath.split(".").pop();
        const newPath=me.id+"/"+recipient+"/"+Date.now()+"."+ext;

        const {error:uploadError}=await db.storage
          .from("chat-photos")
          .upload(newPath,photo,{
            contentType:photo.type||"image/"+ext
          });

        if(uploadError) throw uploadError;

        forwardedMessage="PHOTO:"+newPath;
      }

      const {error:insertError}=await db.from("messages").insert({
        sender_id:me.id,
        receiver_id:recipient,
        message:forwardedMessage,
        reply_to:null
      });

      if(insertError) throw insertError;

      modal.remove();
      appStatus("Message forward ho gaya! ✅");

    }catch(e){
      send.disabled=false;
      send.textContent="Forward";
      appStatus("Forward error: "+e.message);
    }
  };

  cancel.onclick=()=>modal.remove();

  panel.append(send,cancel);
  modal.appendChild(panel);
  document.body.appendChild(modal);
  }

function showChatActionMenu(){
  actionMenu.style.display="block";
  
    if(actionMenu.outsideTapHandler){
    document.removeEventListener(
      "pointerdown",
      actionMenu.outsideTapHandler,
      true
    );
  }

  actionMenu.outsideTapHandler=(e)=>{
    if(!actionMenu.contains(e.target)){
      actionMenu.style.display="none";

      document.removeEventListener(
        "pointerdown",
        actionMenu.outsideTapHandler,
        true
      );

      actionMenu.outsideTapHandler=null;
    }
  };

  document.addEventListener(
    "pointerdown",
    actionMenu.outsideTapHandler,
    true
  );

  const rect=row.getBoundingClientRect();
  const menu=actionMenu.getBoundingClientRect();
  const margin=8;

  let left=rect.left+(rect.width-menu.width)/2;
  left=Math.max(margin,Math.min(left,window.innerWidth-menu.width-margin));

  let top=rect.top-menu.height-8;

  if(top<margin){
    top=rect.bottom+8;
  }

  top=Math.min(top,window.innerHeight-menu.height-margin);
  top=Math.max(margin,top);

  actionMenu.style.left=left+"px";
  actionMenu.style.top=top+"px";
  }

let timer;

row.addEventListener("touchstart",()=>{

});

row.addEventListener("touchend",()=>{
  clearTimeout(timer);
});

});

  const timelineItems=Array.from(fragment.children);

);

return (data||[]).length;
 }

async function loadOlderChatHistory(chatUserId){
  if(!chatUserId)return;
  while(selected===chatUserId){
    const loaded=await loadMessages(true,true);
    if(!loaded || loaded<100 || selected!==chatUserId)break;
  }
}

async function toggleChatStar(messageId){
  const {data:existing,error:findError}=await db
    .from("chat_message_stars")
    .select("id")
    .eq("message_id",messageId)
    .eq("user_id",me.id)
    .maybeSingle();

  if(findError){
    appStatus(findError.message);
    return;
  }

  if(existing){
    const {error}=await db
      .from("chat_message_stars")
      .delete()
      .eq("message_id",messageId)
      .eq("user_id",me.id);

    if(error){
      appStatus(error.message);
      return;
    }

    appStatus("Star removed");
  }else{
    const {error}=await db
      .from("chat_message_stars")
      .insert({
        message_id:messageId,
        user_id:me.id
      });

    if(error){
      appStatus(error.message);
      return;
    }

    appStatus("Message starred ⭐");
  }
}

async function sendChatPhoto(){
  if(chatSendInProgress)return;
  if(!me){
    appStatus("Login session nahi mili. Dobara login karein.");
    return;
  }
  if(!selected){
    appStatus("Chat user select nahi hai. Chat list se dobara chat kholein.");
    return;
  }

  const input=document.getElementById("chatPhotoFile");
  const files=Array.from(input.files || []);
  const caption=document.getElementById("chatPhotoCaption").value.trim();

  if(!files.length){
    appStatus("Pehle photo select karein.");
    return;
  }

  chatSendInProgress=true;
  const sendButton=document.getElementById("sendChatPhotoButton");
  if(sendButton)sendButton.disabled=true;

  try{
    const blocked=await getBlockedIds();
    if(blocked.has(selected)){
      appStatus("Blocked user ko photo nahi bhej sakte.");
      return;
    }

    for(const file of files){
      if(!["image/jpeg","image/png","image/webp"].includes(file.type) || file.size>10*1024*1024){
        appStatus("Har photo JPG, PNG ya WEBP aur 10 MB se chhoti honi chahiye.");
        return;
      }
    }

    appStatus("Photos upload ho rahi hain...");
    const rows=[];

    for(let i=0;i<files.length;i++){
      const file=files[i];
      const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[file.type];
      const path=me.id+"/"+selected+"/"+Date.now()+"_"+i+"."+ext;
      const {error:uploadError}=await db.storage.from("chat-photos").upload(path,file,{contentType:file.type});
      if(uploadError)throw uploadError;

      rows.push({sender_id:me.id,receiver_id:selected,message:"PHOTO:"+path});
    }

    if(caption)rows.push({sender_id:me.id,receiver_id:selected,message:caption});

    const {error}=await db.from("messages").insert(rows);
    if(error)throw error;

    cancelChatPhotoPreview();
    appStatus("Photos send ho gayi!");
    await loadMessages();
  }catch(e){
    appStatus("Photo send nahi hui: "+(e.message||"Unknown error"));
    console.error(e);
  }finally{
    chatSendInProgress=false;
    if(sendButton)sendButton.disabled=false;
  }
}
 let chatPhotoPreviewIndex=0;
let chatPhotoPreviewUrls=[];

function showChatPhotoAt(index){
  if(index<0 || index>=chatPhotoPreviewUrls.length)return;

  chatPhotoPreviewIndex=index;

  document.getElementById("chatPhotoMainImage").src=
    chatPhotoPreviewUrls[index];

  document.querySelectorAll("#chatPhotoThumbnails img").forEach((img,i)=>{
    img.style.border=index===i?"2px solid #ff55a8":"2px solid transparent";
  });
}

function previewChatPhotos(input){
  const files=Array.from(input.files || []);
  const preview=document.getElementById("chatPhotoPreview");
  const count=document.getElementById("chatPhotoCount");
  const thumbnails=document.getElementById("chatPhotoThumbnails");
  const mainArea=document.getElementById("chatPhotoMainArea");

  if(!files.length)return;

  for(const file of files){
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
      appStatus("Only JPG, PNG and WEBP images are allowed.");
      input.value="";
      return;
    }

    if(file.size>10*1024*1024){
      appStatus("Each photo must be under 10 MB.");
      input.value="";
      return;
    }
  }

  chatPhotoPreviewUrls.forEach(url=>URL.revokeObjectURL(url));
  chatPhotoPreviewUrls=files.map(file=>URL.createObjectURL(file));

  thumbnails.innerHTML="";

  chatPhotoPreviewUrls.forEach((url,index)=>{
    const img=document.createElement("img");
    img.src=url;
    img.style.width="62px";
    img.style.height="62px";
    img.style.objectFit="cover";
    img.style.borderRadius="8px";
    img.style.flexShrink="0";
    img.style.border="2px solid transparent";
    img.style.boxSizing="border-box";
    img.style.cursor="pointer";

    img.onclick=()=>showChatPhotoAt(index);
    thumbnails.appendChild(img);
  });

  chatPhotoPreviewIndex=0;
  showChatPhotoAt(0);

  count.innerText=files.length+" photos";

  let startX=0;

  mainArea.ontouchstart=e=>{
    startX=e.touches[0].clientX;
  };

  mainArea.ontouchend=e=>{
    const diff=e.changedTouches[0].clientX-startX;

    if(Math.abs(diff)>50){
      showChatPhotoAt(
        chatPhotoPreviewIndex+(diff<0?1:-1)
      );
    }
  };

  document.body.appendChild(preview);
  document.getElementById("chatWindow").style.display="none";
  preview.style.display="flex";
       }

 function cancelChatPhotoPreview(){
  chatPhotoPreviewUrls.forEach(url=>URL.revokeObjectURL(url));
  chatPhotoPreviewUrls=[];
  chatPhotoPreviewIndex=0;

  const preview=document.getElementById("chatPhotoPreview");

  document.getElementById("chatPhotoMainImage").removeAttribute("src");
  document.getElementById("chatPhotoThumbnails").innerHTML="";

  preview.style.display="none";
  document.getElementById("chatWindow").style.display="flex";
  document.getElementById("chatPhotoFile").value="";
  document.getElementById("chatPhotoCaption").value="";
  document.getElementById("chatPhotoCount").innerText="";
    }

  appStatus("Pehle kisi user ko Chat select karein.");
  return;
}

const input=document.getElementById("message");

if(!message)return;

// Lock immediately, before any asynchronous request, so rapid taps
// cannot pass the guard while getBlockedIds() is still loading.
chatSendInProgress=true;
const sendButton=document.querySelector('button[onclick="sendMessage()"]');
// Keep the message field focused so Android's keyboard stays open after Send.
if(input && document.activeElement!==input){
  input.focus({preventScroll:true});
}
if(sendButton)sendButton.disabled=true;

try{
  const recipientId=selected;
  const blocked=await getBlockedIds();

  if(blocked.has(recipientId)){
    appStatus("Blocked user ko message nahi bhej sakte.");
    return;
  }

  const {error}=await db.from("messages").insert({
    sender_id:me.id,
    receiver_id:recipientId,
    message,
    reply_to:replyingTo ? replyingTo.id : null
  });

  if(error){
    appStatus(error.message);
    return;
  }

  if(input.value.trim()===message)input.value="";
  cancelChatReply();
  if(input)input.focus({preventScroll:true});
  await loadMessages();
  if(input)input.focus({preventScroll:true});
}catch(e){

}finally{
  chatSendInProgress=false;
  if(sendButton)sendButton.disabled=false;
}
}

async function setupGlobalRoomRealtime(){

    await db.removeChannel(globalRoomRealtimeChannel);
    globalRoomRealtimeChannel=null;
  }
  globalRoomRealtimeUserId=me.id;

    .channel("global-rooms-"+me.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"live_rooms"},async(payload)=>{
      const changedRoom=payload?.new;
      if(changedRoom?.status==="ended" && currentJoinedRoom?.id===changedRoom.id){
        if(roomChatChannel){ await db.removeChannel(roomChatChannel); roomChatChannel=null; }
        if(roomMembersChannel){ await db.removeChannel(roomMembersChannel); roomMembersChannel=null; }

      if(roomsScreen && roomsScreen.style.display!=="none"){
        await loadActiveRooms();
        await loadMyPrivateRooms();
      }
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"live_room_members"},async(payload)=>{
      const roomsScreen=document.getElementById("roomsScreen");
      if(roomsScreen && roomsScreen.style.display!=="none"){
        await loadActiveRooms();
        await loadMyPrivateRooms();
      }
      // Refresh the current room count on every membership change.
      // DELETE payloads may not contain old.room_id when replica identity is limited.
      if(currentJoinedRoom){
        const roomId=currentJoinedRoom.id;
        const {count,error}=await db.from("live_room_members")
          .select("user_id",{count:"exact",head:true})
          .eq("room_id",roomId);
        if(!error && count!==null && currentJoinedRoom?.id===roomId){
          const miniCount=document.getElementById("miniRoomMemberCount");
          const joinedCount=document.getElementById("joinedRoomMemberCount");
          if(miniCount) miniCount.textContent=count;
          if(joinedCount) joinedCount.textContent=count;
        }
        const joinedScreen=document.getElementById("joinedRoomScreen");
        if(joinedScreen && joinedScreen.style.display==="block" && currentJoinedRoom?.id===roomId){
          await loadRoomParticipants();
          await syncRoomVoicePeers();
        }
      }
    })
    .subscribe((status)=>{
      if(status==="CHANNEL_ERROR" || status==="TIMED_OUT"){
        console.warn("Global room realtime status:",status);
      }
    });
}

async function restoreJoinedRoom(){
  if(!me) return false;

  const miniBar = document.getElementById("miniRoomBar");
  const joinedScreen = document.getElementById("joinedRoomScreen");
  let room = null;

  const {data:ownedRooms,error:ownedError} = await db
    .from("live_rooms")
    .select("*")
    .eq("created_by",me.id)
    .eq("status","active")
    .order("created_at",{ascending:false})
    .limit(1);

  if(ownedError){
    console.error("Owned room restore error:",ownedError.message);
    return false;
  }

  room = ownedRooms?.[0] || null;

  if(!room){
    const {data:members,error:membersError} = await db
      .from("live_room_members")
      .select("room_id")
      .eq("user_id",me.id);

    if(membersError){
      console.error("Room membership restore error:",membersError.message);
      return false;
    }

    const roomIds = [...new Set((members || []).map(item => item.room_id).filter(Boolean))];

    if(roomIds.length){
      const {data:joinedRooms,error:roomsError} = await db
        .from("live_rooms")
        .select("*")
        .in("id",roomIds)
        .eq("status","active")
        .order("created_at",{ascending:false})
        .limit(1);

      if(roomsError){
        console.error("Joined room restore error:",roomsError.message);
        return false;
      }

      room = joinedRooms?.[0] || null;
    }
  }

  if(!room){
    currentJoinedRoom = null;
    if(miniBar) miniBar.style.display = "none";
    if(joinedScreen) joinedScreen.style.display = "none";
    return false;
  }

  currentJoinedRoom = room;
  document.getElementById("miniRoomName").textContent = room.name || "JABZY Room";
  document.getElementById("joinedRoomName").textContent = room.name || "JABZY Room";

  const {count,countError} = await db
    .from("live_room_members")
    .select("user_id",{count:"exact",head:true})
    .eq("room_id",room.id);

  if(count !== null && count !== undefined){
    document.getElementById("miniRoomMemberCount").textContent = count;
    document.getElementById("joinedRoomMemberCount").textContent = count;
  }

  if(joinedScreen) joinedScreen.style.display = "none";
  if(miniBar) miniBar.style.display = "block";
  return true;
}

  let roomMicOn = false;
let roomMicPermissionAllowed = false;
let roomSpeakerOn = true;
let roomVoiceChannel = null;
let roomVoiceClientId = null;
let roomLocalStream = null;
let roomStatusCheckTimer = null;
const roomVoicePeers = new Map();

async function stopRoomVoice(){
  if(roomStatusCheckTimer){ clearInterval(roomStatusCheckTimer); roomStatusCheckTimer=null; }
  if(roomVoiceChannel){
    await db.removeChannel(roomVoiceChannel);
    roomVoiceChannel = null;
  }
  roomVoicePeers.forEach(peer => {
    peer.connection.close();
    peer.audio.pause();
    peer.audio.srcObject = null;
    peer.audio.remove();
  });
  roomVoicePeers.clear();
  if(roomLocalStream){
    roomLocalStream.getTracks().forEach(track => track.stop());
    roomLocalStream = null;
  }
  roomVoiceClientId = null;
  roomMicOn = false;
}

async function sendRoomVoiceSignal(toClient, signal){
  if(!roomVoiceChannel || !roomVoiceClientId) return;
  await roomVoiceChannel.send({
    type:"broadcast",
    event:"signal",
    payload:{fromClient:roomVoiceClientId,fromUser:me.id,toClient,signal}
  });
}

async function ensureRoomVoicePeer(remoteClient){
  if(roomVoicePeers.has(remoteClient)) return roomVoicePeers.get(remoteClient);
  const pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}],
    iceCandidatePoolSize:10,
    bundlePolicy:"max-bundle",
    rtcpMuxPolicy:"require"
  });
  const audio = document.createElement("audio");
  audio.autoplay = true;
  audio.playsInline = true;
  audio.style.display = "none";
  document.body.appendChild(audio);
  const peer = {
    connection:pc,
    audio,
    makingOffer:false,
    ignoreOffer:false,
    settingRemoteAnswer:false,
    pendingCandidates:[],
    polite:roomVoiceClientId > remoteClient
  };
  roomVoicePeers.set(remoteClient,peer);
  const transceiver = pc.addTransceiver("audio",{direction:"sendrecv"});
  if(roomLocalStream){
    const track = roomLocalStream.getAudioTracks()[0];
    if(track) await transceiver.sender.replaceTrack(track);
  }
  pc.ontrack = event => {
    const incomingStream = event.streams?.[0] || new MediaStream([event.track]);
    audio.srcObject = incomingStream;
    audio.volume = roomSpeakerOn ? 1 : 0;
    audio.play().catch(error => console.warn("Room audio playback blocked:",error));
  };
  pc.onicecandidate = event => {
    if(event.candidate) sendRoomVoiceSignal(remoteClient,{candidate:event.candidate});
  };
  return peer;
}

async function syncRoomVoicePeers(){
  if(!currentJoinedRoom || !roomVoiceChannel || !roomVoiceClientId) return;
  const {data:members,error} = await db.from("live_room_members")
    .select("user_id,audio_role,mic_allowed")
    .eq("room_id",currentJoinedRoom.id);
  if(error){ console.error("Voice members error:",error); return; }

  const allowedUsers = new Set([
    currentJoinedRoom.created_by,
    ...(members || []).filter(m =>
      m.audio_role === "speaker" || m.mic_allowed === true
    ).map(m => m.user_id)
  ]);
  const localCanSpeak = allowedUsers.has(me.id);
  const presence = roomVoiceChannel.presenceState();
  const active = new Set();

  for(const clientId of Object.keys(presence)){
    if(clientId === roomVoiceClientId) continue;
    const remote = (presence[clientId] || [])[0];
    if(!remote?.userId || remote.userId === me.id) continue;
    if(!localCanSpeak && !allowedUsers.has(remote.userId)) continue;
    active.add(clientId);
    const peer = await ensureRoomVoicePeer(clientId);
    if(roomVoiceClientId < clientId && !peer.initialOfferSent){
      peer.initialOfferSent = true;
      try{
        peer.makingOffer = true;
        await peer.connection.setLocalDescription();
        await sendRoomVoiceSignal(clientId,{description:peer.connection.localDescription});
      }catch(error){
        console.error("Voice offer error:",error);
      }finally{
        peer.makingOffer = false;
      }
    }
  }
  for(const [clientId,peer] of roomVoicePeers){
    if(!active.has(clientId)){
      peer.connection.close();
      peer.audio.remove();
      roomVoicePeers.delete(clientId);
    }
  }
}

async function handleRoomVoiceSignal(message){
  if(!message || message.toClient !== roomVoiceClientId ||
     message.fromUser === me.id || !message.fromClient) return;
  const {data:members,error} = await db.from("live_room_members")
    .select("user_id,audio_role,mic_allowed")
    .eq("room_id",currentJoinedRoom.id);
  if(error) return;
  const remoteAllowed = message.fromUser === currentJoinedRoom.created_by ||
    (members || []).some(m => m.user_id === message.fromUser &&
      (m.audio_role === "speaker" || m.mic_allowed === true));
  if(!roomMicPermissionAllowed && !remoteAllowed) return;

  const peer = await ensureRoomVoicePeer(message.fromClient);
  const pc = peer.connection;
  const signal = message.signal || {};
  try{
    if(signal.description){
      const description = signal.description;
      const ready = !peer.makingOffer &&
        (pc.signalingState === "stable" || peer.settingRemoteAnswer);
      const collision = description.type === "offer" && !ready;
      peer.ignoreOffer = !peer.polite && collision;
      if(peer.ignoreOffer) return;
      peer.settingRemoteAnswer = description.type === "answer";
      if(collision && peer.polite) await pc.setLocalDescription({type:"rollback"});
      await pc.setRemoteDescription(description);
      peer.settingRemoteAnswer = false;
      for(const candidate of peer.pendingCandidates.splice(0)){
        try{ await pc.addIceCandidate(candidate); }
        catch(candidateError){ console.warn("Queued ICE candidate failed:",candidateError); }
      }
      if(description.type === "offer"){
        await pc.setLocalDescription();
        await sendRoomVoiceSignal(message.fromClient,{description:pc.localDescription});
      }
    }else if(signal.candidate){
      if(!pc.remoteDescription){
        peer.pendingCandidates.push(signal.candidate);
      }else{
        try{ await pc.addIceCandidate(signal.candidate); }
        catch(error){ if(!peer.ignoreOffer) throw error; }
      }
    }
  }catch(error){
    console.error("Voice signal error:",error);
  }
}

async function checkJoinedRoomStillActive(){
  if(!currentJoinedRoom) return;
  const roomId = currentJoinedRoom.id;
  const {data,error} = await db.from("live_rooms")

  if(error){
    console.warn("Room status check failed:",error.message);
    return;
  }
  if(!data || data.status !== "active"){
    if(!currentJoinedRoom || currentJoinedRoom.id !== roomId) return;
    if(roomChatChannel){ await db.removeChannel(roomChatChannel); roomChatChannel=null; }
    if(roomMembersChannel){ await db.removeChannel(roomMembersChannel); roomMembersChannel=null; }
    await stopRoomVoice();
    currentJoinedRoom=null;
    roomMicPermissionAllowed=false;
    updateRoomMicButtonState();
    const joinedScreen=document.getElementById("joinedRoomScreen");
    const miniBar=document.getElementById("miniRoomBar");
    if(joinedScreen) joinedScreen.style.display="none";
    if(miniBar) miniBar.style.display="none";
    showTab("rooms");
    await loadActiveRooms();
    await loadMyPrivateRooms();
    alert("Host ne ye room close kar diya hai.");
  }
}

async function startRoomVoice(){
  if(!currentJoinedRoom || !me) return;
  await stopRoomVoice();
  roomVoiceClientId = crypto.randomUUID();
  roomVoiceChannel = db.channel("room-voice:" + currentJoinedRoom.id,{
    config:{
      private:false,
      presence:{key:roomVoiceClientId},
      broadcast:{self:false}
    }
  });
  roomVoiceChannel
    .on("broadcast",{event:"signal"},({payload})=>handleRoomVoiceSignal(payload))
    .on("presence",{event:"sync"},()=>syncRoomVoicePeers())
    .subscribe(async status=>{
      if(status === "SUBSCRIBED"){
        await roomVoiceChannel.track({userId:me.id});
        await syncRoomVoicePeers();
      }else if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
        console.error("Room voice channel:",status);
      }
    });
  const watchedRoomId = currentJoinedRoom.id;
  roomStatusCheckTimer = setInterval(()=>{
    if(currentJoinedRoom?.id === watchedRoomId) checkJoinedRoomStillActive();
  },2500);
}

function updateRoomMicButtonState(){
  document.querySelectorAll('[onclick="toggleRoomMic()"]').forEach(btn => {
    btn.disabled = !roomMicPermissionAllowed;
    btn.textContent = roomMicPermissionAllowed
      ? (roomMicOn ? "🎙️ Mic ON" : "🎤 Mic OFF")
      : "🔒 Mic Locked";
    btn.title = roomMicPermissionAllowed
      ? "Turn your microphone on or off"
      : "Room Owner se Mic permission maangein";
    btn.style.opacity = roomMicPermissionAllowed ? "1" : ".6";
    btn.style.background = roomMicPermissionAllowed
      ? (roomMicOn ? "#b83255" : "#287a55")

async function toggleRoomMic(){
  if(!roomMicPermissionAllowed){
    alert("Mic permission Room Owner se leni hogi.");
    return;
  }
  if(!currentJoinedRoom){ alert("Pehle Live Room join karein."); return; }
  if(roomMicOn){
    roomMicOn = false;
    roomLocalStream?.getAudioTracks().forEach(track => track.enabled = false);
    updateRoomMicButtonState();
    return;
  }
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Microphone access available nahi hai. HTTPS par app kholein.");
    }
    if(!roomLocalStream){
      roomLocalStream = await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
        video:false
      });
    }
    const track = roomLocalStream.getAudioTracks()[0];
    if(!track) throw new Error("Microphone audio track nahi mila.");
    track.enabled = true;
    for(const peer of roomVoicePeers.values()){
      const sender = peer.connection.getTransceivers()
        .find(item => item.receiver.track.kind === "audio")?.sender;
      if(sender) await sender.replaceTrack(track);
    }
    roomMicOn = true;
    updateRoomMicButtonState();
  }catch(error){
    roomMicOn = false;
    updateRoomMicButtonState();
    alert("Microphone start nahi hua: " + error.message);
  }
}

function toggleRoomSpeaker(){
  roomSpeakerOn = !roomSpeakerOn;

  document.querySelectorAll('[onclick="toggleRoomSpeaker()"]').forEach(btn => {

      : "🔇 Speaker OFF";
  });
  roomVoicePeers.forEach(peer => {
    peer.audio.volume = roomSpeakerOn ? 1 : 0;
  });
}

let activeJabzyStory = null;

function openStoryUpload(){
  if(!me){alert("Please login first.");return;}
  document.getElementById("storyUploadModal").style.display="block";

function closeStoryUpload(){
  document.getElementById("storyUploadModal").style.display="none";
}
function previewJabzyStoryMedia(event){
  const file=event.target.files && event.target.files[0];
  const wrap=document.getElementById("storyMediaPreview");
  const img=document.getElementById("storyPreviewImage");
  const video=document.getElementById("storyPreviewVideo");
  img.style.display="none";video.style.display="none";
  img.removeAttribute("src");video.pause();video.removeAttribute("src");video.load();
  if(!file){wrap.style.display="none";return;}
  const url=URL.createObjectURL(file);
  wrap.style.display="flex";
  if(file.type.startsWith("image/")){img.src=url;img.style.display="block";}
  else if(file.type.startsWith("video/")){video.src=url;video.style.display="block";}
  else{wrap.style.display="none";}
}
async function uploadJabzyStory(){
  const file=document.getElementById("storyMediaFile").files[0];
  const caption=document.getElementById("storyCaption").value.trim();
  const status=document.getElementById("storyUploadStatus");
  const btn=document.getElementById("storyUploadBtn");
  if(!file){status.textContent="Photo ya video select karein.";return;}
  if(!file.type.startsWith("image/") && !file.type.startsWith("video/")){status.textContent="Only photo/video allowed.";return;}
  if(file.size>50*1024*1024){status.textContent="File 50 MB se chhoti honi chahiye.";return;}
  btn.disabled=true;status.textContent="Uploading...";
  const ext=(file.name.split(".").pop()||"file").replace(/[^a-zA-Z0-9]/g,"");
  const path=me.id+"/"+Date.now()+"."+ext;
  const {error:upErr}=await db.storage.from("stories").upload(path,file,{contentType:file.type,upsert:false});
  if(upErr){status.textContent=upErr.message;btn.disabled=false;return;}
  const {data:urlData}=db.storage.from("stories").getPublicUrl(path);
  const {error:insertErr}=await db.from("stories").insert({
    user_id:me.id,media_url:urlData.publicUrl,
    media_type:file.type.startsWith("video/")?"video":"image",
    caption:caption||null
  });
  if(insertErr){
    await db.storage.from("stories").remove([path]);
    status.textContent=insertErr.message;btn.disabled=false;return;
  }
  document.getElementById("storyMediaFile").value="";
  document.getElementById("storyCaption").value="";
  status.textContent="Story shared successfully ❤️";
  await loadJabzyStories();
  setTimeout(closeStoryUpload,650);
  btn.disabled=false;
}

function changeJabzyStory(direction){
  if(!activeJabzyStoryUserId)return;
  const groups=new Map();
  jabzyStoryRows.forEach(story=>{
    if(!groups.has(story.user_id))groups.set(story.user_id,[]);
    groups.get(story.user_id).push(story);
  });
  const userIds=[...groups.keys()];
  let userIndex=userIds.indexOf(activeJabzyStoryUserId);
  if(userIndex<0)return;
  let nextStoryIndex=activeJabzyStoryIndex+direction;
  if(nextStoryIndex<0){
    if(userIndex===0)return;
    userIndex--;
    nextStoryIndex=groups.get(userIds[userIndex]).length-1;
  }else if(nextStoryIndex>=groups.get(userIds[userIndex]).length){
    if(userIndex>=userIds.length-1)return;
    userIndex++;
    nextStoryIndex=0;
  }
  openJabzyStory(userIds[userIndex],nextStoryIndex);
}

let storyTouchStartY=0;
(function attachStorySwipeGestures(){
  const viewer=document.getElementById("storyViewerModal");
  if(!viewer || viewer.dataset.swipeReady==="1")return;
  viewer.dataset.swipeReady="1";
  const storyMediaArea=document.getElementById("storyViewerMedia");
  storyMediaArea.addEventListener("click",event=>{
    if(event.target && event.target.tagName==="VIDEO")return;
    if(activeJabzyStoryOwner){
      const panel=document.getElementById("storyOwnerPanel");
      if(panel && panel.style.display==="block"){
        panel.style.display="none";
        document.getElementById("storyOwnerSwipeHint").style.display="block";
        return;
      }
    }
    const x=event.clientX || (event.changedTouches && event.changedTouches[0]?.clientX) || 0;
    if(x>window.innerWidth/2)changeJabzyStory(1);
    else changeJabzyStory(-1);
  });
  viewer.addEventListener("touchstart",event=>{storyTouchStartY=event.touches[0].clientY;},{passive:true});
  viewer.addEventListener("touchend",event=>{
    if(!activeJabzyStory)return;
    const delta=event.changedTouches[0].clientY-storyTouchStartY;
    const panel=document.getElementById("storyOwnerPanel");
    if(activeJabzyStoryOwner){
      if(delta < -65){openStoryOwnerPanel("viewers",true);}
      else if(delta > 75){
        closeJabzyStory();
        showTab("home");
      }
    }else if(delta > 75){
      closeJabzyStory();
      showTab("home");
    }
  },{passive:true});
})();

let languageObserver=null;
const languageTextNodes=new WeakMap();
function translateJabzyElement(root,lang){
  const hindi=lang==="hi";
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(!languageTextNodes.has(node)) languageTextNodes.set(node,node.nodeValue);
    const original=languageTextNodes.get(node);
    const trimmed=original.trim();
    if(!trimmed)return;
    const translated=JABZY_TRANSLATIONS[trimmed];
    if(hindi && translated) node.nodeValue=original.replace(trimmed,translated);
    else if(!hindi && node.nodeValue!==original) node.nodeValue=original;
  });
  const attrs=["placeholder","title","aria-label"];
  root.querySelectorAll?.("*").forEach(el=>attrs.forEach(attr=>{
    if(!el.hasAttribute(attr))return;
    const key="data-jabzy-original-"+attr;
    if(!el.hasAttribute(key))el.setAttribute(key,el.getAttribute(attr));
    const original=el.getAttribute(key);
    el.setAttribute(attr,hindi?(JABZY_TRANSLATIONS[original]||original):original);
  }));
}
function setAppLanguage(lang){
  lang=lang==="hi"?"hi":"en";
  try{localStorage.setItem("jabzyLanguage",lang);}catch(e){}
  document.documentElement.lang=lang;
  translateJabzyElement(document.body,lang);
  const navLabels={home:lang==="hi"?"होम":"Home",friends:lang==="hi"?"दोस्त":"Friends",chats:lang==="hi"?"चैट":"Chats",rooms:lang==="hi"?"रूम्स":"Rooms",profile:lang==="hi"?"प्रोफ़ाइल":"Profile"};

  const hiBtn=document.getElementById("languageHiBtn"),enBtn=document.getElementById("languageEnBtn");
  if(hiBtn)hiBtn.textContent=lang==="hi"?"✓ चुनी गई":"Select";
  if(enBtn)enBtn.textContent=lang==="en"?"✓ Selected":"चुनें";
  const status=document.getElementById("languageStatus");
  if(status)status.textContent=lang==="hi"?"ऐप की भाषा हिंदी है।":"App language is English.";
  if(!languageObserver){
    languageObserver=new MutationObserver(()=>{let current="en";try{current=localStorage.getItem("jabzyLanguage")||"en";}catch(e){}translateJabzyElement(document.body,current);});
    languageObserver.observe(document.body,{childList:true,subtree:true});
  }
}

  if(visible("jabzySettingsModal")){ jabzyBackPressAt=0; closeJabzySettings(); return true; }
  if(visible("blockedUsersPanel")){ jabzyBackPressAt=0; document.getElementById("blockedUsersPanel").style.display="none"; return true; }
  if(visible("accountSettingsPanel")){ jabzyBackPressAt=0; document.getElementById("accountSettingsPanel").style.display="none"; return true; }
  if(visible("profileEdit")){ jabzyBackPressAt=0; cancelEditProfile(); return true; }
  if(visible("chatWindow")){ jabzyBackPressAt=0; backToChatList(); return true; }
  if(visible("publicProfileView")){ jabzyBackPressAt=0; closePublicProfile(); return true; }
  if(visible("joinedRoomScreen")){ jabzyBackPressAt=0; minimizeJoinedRoom(); return true; }
  if(visible("notificationsScreen")){ jabzyBackPressAt=0; closeNotifications(); return true; }
  if(visible("replyPreview")){ jabzyBackPressAt=0; cancelChatReply(); return true; }
  const currentTab=localStorage.getItem("jabzyLastTab")||"home";
  if(currentTab!=="home") jabzyBackPressAt=0;
  while(jabzyTabHistory.length){
    const previousTab=jabzyTabHistory.pop();
    if(previousTab && previousTab!==currentTab){ showTab(previousTab,true); return true; }
  }
  if(currentTab!=="home"){ showTab("home",true); return true; }
  // Home is the root screen: keep the website open on every Back press.
  jabzyBackPressAt=0;
  appStatus("You're on JABZY Home");
  return true;
}

let selectedRoomGift = null;
let roomGiftsChannel = null;
const ROOM_GIFT_CATALOG = {
 rose:{name:"Rose",emoji:"🌹",cost:10},
 heart:{name:"Heart",emoji:"❤️",cost:25},
 teddy:{name:"Teddy",emoji:"🧸",cost:50},

async function openRoomGift(){
 if(!currentJoinedRoom || !me?.id){alert("Pehle Room join karein.");return;}
 const picker=document.getElementById("roomGiftPicker");
 const recipient=document.getElementById("roomGiftRecipient");
 const status=document.getElementById("roomGiftStatus");
 const send=document.getElementById("roomGiftSendButton");
 if(!picker||!recipient)return;
 selectedRoomGift=null;send.disabled=true;status.textContent="Room members load ho rahe hain…";
 recipient.innerHTML='<option value="">Choose room member</option>';
 picker.style.display="block";
 const [{data:members,error:memberError},{data:wallet,error:walletError}]=await Promise.all([
  db.from("live_room_members").select("user_id").eq("room_id",currentJoinedRoom.id),
  db.from("user_coins").select("balance").eq("user_id",me.id).maybeSingle()
 ]);
 if(memberError){status.textContent="Members load nahi hue: "+memberError.message;return;}
 if(walletError){status.textContent="Coin balance load nahi hua. SQL setup check karein.";return;}
 const ids=[...new Set([currentJoinedRoom.created_by,...(members||[]).map(x=>x.user_id)])].filter(id=>id!==me.id);
 const {data:profiles,error}=ids.length?await db.from("profiles").select("id,username").in("id",ids):{data:[],error:null};
 if(error){status.textContent="Members load nahi hue: "+error.message;return;}
 (profiles||[]).forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent="@"+(p.username||"Member");recipient.appendChild(o);});
 document.getElementById("roomGiftBalance").textContent="🪙 Coins: "+Number(wallet?.balance||0);
 if(!ids.length)status.textContent="Gift bhejne ke liye Room mein doosra member hona chahiye.";
 else status.textContent="Gift chunein aur member select karein.";
}
function closeRoomGift(){document.getElementById("roomGiftPicker").style.display="none";}
function selectRoomGift(key){
 if(!ROOM_GIFT_CATALOG[key])return;
 selectedRoomGift=key;
 document.querySelectorAll("#roomGiftChoices button").forEach(b=>{b.style.outline=b.dataset.gift===key?"2px solid #ffd166":"none";});
 document.getElementById("roomGiftSendButton").disabled=false;
}
async function sendRoomGift(){
 const recipient=document.getElementById("roomGiftRecipient").value;
 const status=document.getElementById("roomGiftStatus");
 const btn=document.getElementById("roomGiftSendButton");
 if(!recipient||!selectedRoomGift){status.textContent="Member aur Gift dono select karein.";return;}
 const gift=ROOM_GIFT_CATALOG[selectedRoomGift];
 btn.disabled=true;status.textContent="Gift bheja ja raha hai…";
 const {data,error}=await db.rpc("send_room_gift",{p_room_id:currentJoinedRoom.id,p_recipient_id:recipient,p_gift_code:selectedRoomGift});
 if(error){status.textContent=error.message.includes("INSUFFICIENT_COINS")?"Aapke paas enough Coins nahi hain.":error.message;btn.disabled=false;return;}
 const bal=await db.from("user_coins").select("balance").eq("user_id",me.id).maybeSingle();
 if(!bal.error)document.getElementById("roomGiftBalance").textContent="🪙 Coins: "+Number(bal.data?.balance||0);
 status.textContent=gift.emoji+" Gift successfully sent!";
 btn.disabled=false;
 setTimeout(closeRoomGift,900);
}
function showRoomGiftAnimation(row){
 const gift=ROOM_GIFT_CATALOG[row.gift_code];if(!gift)return;
 const box=document.getElementById("roomGiftAnimation"),content=document.getElementById("roomGiftAnimationContent");
 if(!box||!content)return;
 content.textContent=gift.emoji+" "+(row.sender_name||"Someone")+" sent a "+gift.name+"!";
 box.style.display="flex";
 setTimeout(()=>{box.style.display="none";},2800);
}
async function setupRoomGiftsRealtime(){
 if(roomGiftsChannel){await db.removeChannel(roomGiftsChannel);roomGiftsChannel=null;}
 if(!currentJoinedRoom)return;
 roomGiftsChannel=db.channel("room-gifts-"+currentJoinedRoom.id)
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"room_gifts",filter:"room_id=eq."+currentJoinedRoom.id},async payload=>{
   const gift=payload.new;
   if(gift.recipient_id!==me?.id)return;
   const {data}=await db.from("profiles").select("username").eq("id",gift.sender_id).maybeSingle();
   showRoomGiftAnimation({...gift,sender_name:data?.username||"A room member"});
  }).subscribe();
}

async function loadDailyRewardsWallet(){
  const balanceEl=document.getElementById("dailyRewardsCoinBalance");
  const streakEl=document.getElementById("dailyRewardsStreak");
  if(!me || !me.id){
    if(balanceEl)balanceEl.textContent="0";
    if(streakEl)streakEl.textContent="0";
    showDailyRewardsStatus("Please sign in to view your coin balance.");
    return;
  }

  if(balanceEl)balanceEl.textContent="…";
  if(streakEl)streakEl.textContent="…";

  const {data,error}=await db
    .from("user_coins")
    .select("balance,streak_days")
    .eq("user_id",me.id)
    .maybeSingle();

  if(error){
    console.error("Daily Rewards wallet load failed:",error);
    if(balanceEl)balanceEl.textContent="—";
    if(streakEl)streakEl.textContent="—";
    showDailyRewardsStatus("Could not load your rewards. Please try again.");
    return;
  }

  if(balanceEl)balanceEl.textContent=String(data?.balance ?? 0);
  if(streakEl)streakEl.textContent=String(data?.streak_days ?? 0);
}

async function openDailyRewards(){
  const screen=document.getElementById("dailyRewardsScreen");
  if(!screen)return;
  if(screen.parentElement!==document.body)document.body.appendChild(screen);
  const status=document.getElementById("dailyRewardsStatus");
  if(status)status.textContent="Loading your rewards…";
  showTab("dailyRewards");
  const nav=document.querySelector(".bottom-nav");
  if(nav)nav.style.setProperty("display","none","important");
  screen.style.setProperty("display","block","important");
  await loadDailyRewardsWallet();
}
function closeDailyRewards(){
  const screen=document.getElementById("dailyRewardsScreen");
  if(screen)screen.style.setProperty("display","none","important");
  showTab("home");
  const nav=document.querySelector(".bottom-nav");
  if(nav)nav.style.setProperty("display","flex","important");
}
function showDailyRewardsStatus(message){
  const status=document.getElementById("dailyRewardsStatus");
  if(status)status.textContent=message;
}
