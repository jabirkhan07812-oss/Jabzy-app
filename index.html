<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JABZY - Make New Friends</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#10101b;color:white;font-family:Arial;padding:20px}
h1{color:#ff4d91;text-align:center;font-size:38px}
.card{background:#202033;padding:16px;border-radius:14px;margin:15px 0}
input,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:0;border-radius:9px}
button{background:#ff4d91;color:white;font-weight:bold}
.hidden{display:none}
.user{padding:12px;background:#303047;margin:8px 0;border-radius:9px}
.photo{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;margin:10px auto;border:3px solid #ff4d91}
.userphoto{width:65px;height:65px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:10px}
.danger{background:#a83245}
</style>
</head>
<body>

<h1>JABZY ❤️</h1>
<p style="text-align:center">Make New Friends • 18+</p>

<div class="card" id="login">
<h3>Login / Sign Up</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="signin()">Login</button>
<p id="status"></p>
</div>

<div class="card hidden" id="app">
<h3>Your Profile</h3>
<img id="myPhoto" class="photo hidden" alt="Your photo">
<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp">
<button onclick="uploadPhoto()">Upload Photo</button>

<input id="username" placeholder="Your name">
<input id="age" type="number" placeholder="Your age (18+)">
<textarea id="bio" placeholder="About yourself"></textarea>
<button onclick="saveProfile()">Save Profile</button>

<h3>Discover People ❤️</h3>
<div id="people">Loading...</div>

<h3>Your Matches 💕</h3>
<div id="matches">No matches yet.</div>

<h3 id="chatTitle">Chat</h3>
<div id="messages"></div>
<input id="message" placeholder="Write a message">
<button onclick="sendMessage()">Send Message</button>
<button onclick="loadMessages()">Refresh Chat</button>
<button onclick="logout()">Logout</button>
<p id="appStatus"></p>
</div>

<script>
const SUPABASE_URL="https://rpgclomsjxvwhuwusvii.supabase.co";
const SUPABASE_KEY="sb_publishable_J8LnRDjy_18IaAVxKeq6OQ_BJFFzrXB";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let selected=null;

function status(t){
document.getElementById("status").innerText=t;
}
function appStatus(t){
document.getElementById("appStatus").innerText=t;
}

async function signup(){
const email=document.getElementById("email").value;
const password=document.getElementById("password").value;
const {error}=await db.auth.signUp({email,password});
status(error?error.message:"Account created. Check your email for confirmation.");
}

async function signin(){
const email=document.getElementById("email").value;
const password=document.getElementById("password").value;
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error){status(error.message);return}
me=data.user;
await startApp();
}

async function startApp(){
document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
await loadProfile();
await loadPeople();
await loadMatches();
}

async function saveProfile(){
const username=document.getElementById("username").value.trim();
const age=Number(document.getElementById("age").value);
const bio=document.getElementById("bio").value;
if(!username||age<18){
appStatus("Name aur age 18+ zaroori hai.");
return;
}
const {error}=await db.from("profiles").upsert({
id:me.id,username,age,bio
});
appStatus(error?error.message:"Profile saved!");
await loadPeople();
}

async function loadProfile(){
const {data,error}=await db.from("profiles")
.select("*").eq("id",me.id).maybeSingle();
if(error){appStatus(error.message);return}
if(data){
document.getElementById("username").value=data.username||"";
document.getElementById("age").value=data.age||"";
document.getElementById("bio").value=data.bio||"";
if(data.photo_url){
const img=document.getElementById("myPhoto");
img.src=data.photo_url;
img.classList.remove("hidden");
}
}
}

async function uploadPhoto(){
const file=document.getElementById("photoFile").files[0];
if(!file){appStatus("Pehle photo choose karein.");return}
if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
appStatus("JPG, PNG ya WEBP photo select karein.");return;
}
if(file.size>5*1024*1024){
appStatus("Photo 5 MB se chhoti honi chahiye.");return;
}
const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[file.type];
const path=me.id+"/avatar-"+Date.now()+"."+ext;
appStatus("Photo upload ho rahi hai...");

const {error:uploadError}=await db.storage.from("profile-photos")
.upload(path,file,{contentType:file.type,cacheControl:"3600"});
if(uploadError){appStatus(uploadError.message);return}

const {data}=db.storage.from("profile-photos").getPublicUrl(path);
const {error:saveError}=await db.from("profiles").upsert({
id:me.id,photo_url:data.publicUrl
});
if(saveError){appStatus(saveError.message);return}

const img=document.getElementById("myPhoto");
img.src=data.publicUrl;
img.classList.remove("hidden");
document.getElementById("photoFile").value="";
appStatus("Profile photo uploaded!");
await loadPeople();
}

async function getBlockedIds(){
const {data,error}=await db.from("blocks")
.select("blocker_id,blocked_id")
.or("blocker_id.eq."+me.id+",blocked_id.eq."+me.id);

if(error)throw error;

const ids=new Set();
(data||[]).forEach(b=>{
ids.add(b.blocker_id);
ids.add(b.blocked_id);
});
ids.delete(me.id);
return ids;
}

async function loadPeople(){
const box=document.getElementById("people");
const {data,error}=await db.from("profiles")
.select("id,username,age,bio,photo_url");

if(error){box.innerText=error.message;return}

let blocked;
try{blocked=await getBlockedIds()}
catch(e){box.innerText="Block list error: "+e.message;return}

box.innerHTML="";

(data||[])
.filter(p=>p.id!==me.id&&!blocked.has(p.id))
.forEach(p=>{
const div=document.createElement("div");
div.className="user";

if(p.photo_url){
const img=document.createElement("img");
img.className="userphoto";
img.src=p.photo_url;
img.alt="Profile photo";
div.appendChild(img);
}

const name=document.createElement("b");
name.textContent=p.username||"User";

const info=document.createElement("p");
info.textContent=(p.age||"")+" years • "+(p.bio||"");

const likeBtn=document.createElement("button");
likeBtn.textContent="Like ❤️";
likeBtn.onclick=()=>sendLike(p.id,p.username);

const chatBtn=document.createElement("button");
chatBtn.textContent="Chat 💬";
chatBtn.onclick=()=>chooseUser(p.id,p.username);

const blockBtn=document.createElement("button");
blockBtn.className="danger";
blockBtn.textContent="Block 🚫";
blockBtn.onclick=()=>blockUser(p.id,p.username);

const reportBtn=document.createElement("button");
reportBtn.className="danger";
reportBtn.textContent="Report ⚠️";
reportBtn.onclick=()=>reportUser(p.id,p.username);

div.append(name,info,likeBtn,chatBtn,blockBtn,reportBtn);
box.appendChild(div);
});

if(!box.children.length){
box.innerText="Abhi koi doosra profile nahi hai.";
}
}

async function sendLike(targetId,targetName){
appStatus("Like bheja ja raha hai...");

const {error}=await db.from("likes").upsert({
from_user:me.id,
to_user:targetId
},{onConflict:"from_user,to_user",ignoreDuplicates:true});

if(error){appStatus(error.message);return}

const {data:reverse,error:checkError}=await db.from("likes")
.select("id")
.eq("from_user",targetId)
.eq("to_user",me.id)
.maybeSingle();

if(checkError){appStatus(checkError.message);return}

if(reverse){
appStatus("💕 It's a Match! Aap dono ek doosre ko pasand karte hain.");
await loadMatches();
}else{
appStatus("❤️ Like bhej diya! Agar woh bhi Like karega to Match hoga.");
}
}

async function loadMatches(){
const box=document.getElementById("matches");
const {data:sent,error}=await db.from("likes")
.select("to_user").eq("from_user",me.id);

if(error){box.innerText=error.message;return}

const ids=(sent||[]).map(x=>x.to_user);
if(!ids.length){box.innerText="No matches yet.";return}

const {data:received,error:matchError}=await db.from("likes")
.select("from_user").in("from_user",ids).eq("to_user",me.id);

if(matchError){box.innerText=matchError.message;return}

let blocked;
try{blocked=await getBlockedIds()}
catch(e){box.innerText=e.message;return}

const matchIds=(received||[])
.map(x=>x.from_user)
.filter(id=>!blocked.has(id));

if(!matchIds.length){box.innerText="No matches yet.";return}

const {data:profiles,error:profileError}=await db.from("profiles")
.select("id,username").in("id",matchIds);

if(profileError){box.innerText=profileError.message;return}

box.innerHTML="";
(profiles||[]).forEach(p=>{
const btn=document.createElement("button");
btn.textContent="💕 "+(p.username||"User")+" - Chat";
btn.onclick=()=>chooseUser(p.id,p.username);
box.appendChild(btn);
});
}

async function blockUser(targetId,targetName){
if(!confirm(targetName+" ko block karna chahte hain?"))return;

const {error}=await db.from("blocks").insert({
blocker_id:me.id,
blocked_id:targetId
});

if(error){
appStatus(error.message);
return;
}

if(selected===targetId){
selected=null;
document.getElementById("chatTitle").innerText="Chat";
document.getElementById("messages").innerHTML="";
}

appStatus(targetName+" ko block kar diya gaya.");
await loadPeople();
await loadMatches();
}

async function reportUser(targetId,targetName){
const reason=prompt(
targetName+" ko report karne ka reason likhein:"
);

if(!reason||!reason.trim()){
appStatus("Report cancel kar di gayi.");
return;
}

const {error}=await db.from("reports").insert({
reporter_id:me.id,
reported_id:targetId,
reason:reason.trim().slice(0,500)
});

if(error){
appStatus(error.message);
return;
}

appStatus("Report submit ho gayi. Shukriya.");
}

async function chooseUser(id,name){
let blocked;
try{blocked=await getBlockedIds()}
catch(e){appStatus(e.message);return}

if(blocked.has(id)){
appStatus("Yeh user block hai. Chat nahi kar sakte.");
return;
}

selected=id;
document.getElementById("chatTitle").innerText="Chat with "+name;
await loadMessages();
}

async function loadMessages(){
if(!selected)return;

let blocked;
try{blocked=await getBlockedIds()}
catch(e){appStatus(e.message);return}

if(blocked.has(selected)){
appStatus("Blocked user ke saath chat nahi ho sakti.");
return;
}

const {data,error}=await db.from("messages").select("*")
.or("and(sender_id.eq."+me.id+",receiver_id.eq."+selected+"),and(sender_id.eq."+selected+",receiver_id.eq."+me.id+")")
.order("created_at",{ascending:true});

const box=document.getElementById("messages");
box.innerHTML="";
if(error){box.innerText=error.message;return}

(data||[]).forEach(m=>{
const p=document.createElement("p");
p.textContent=(m.sender_id===me.id?"You: ":"Them: ")+m.message;
box.appendChild(p);
});
}

async function sendMessage(){
if(!selected){
appStatus("Pehle kisi user ko Chat select karein.");
return;
}

let blocked;
try{blocked=await getBlockedIds()}
catch(e){appStatus(e.message);return}

if(blocked.has(selected)){
appStatus("Blocked user ko message nahi bhej sakte.");
return;
}

const input=document.getElementById("message");
const message=input.value.trim();
if(!message)return;

const {error}=await db.from("messages").insert({
sender_id:me.id,receiver_id:selected,message
});

if(error){appStatus(error.message);return}
input.value="";
await loadMessages();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

db.auth.getSession().then(({data})=>{
if(data.session){
me=data.session.user;
startApp();
}
});
</script>
</body>
  </html>
